<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 1 - Hello World</title>
    <style>
        /* Base styles (Mobile First approach) */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Changed from height to min-height for mobile scrolling */
            margin: 0;
            background-color: #f4f4f9;
            padding: 1rem; /* Prevents the card from touching screen edges on mobile */
            box-sizing: border-box;
        }
        
        .card {
            text-align: center;
            padding: 2rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%; /* Takes up full available width on small screens... */
            max-width: 500px; /* ...but never grows wider than 500px on desktop */
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
            color: #333;
        }

        p {
            color: #666;
            margin-bottom: 0;
        }

        /* Media Query: Adjustments for very small screens (phones) */
        @media (max-width: 480px) {
            .card {
                padding: 1.5rem 1rem; /* Slightly less padding to save space */
            }
            
            h1 {
                font-size: 1.5rem; /* Shrinks the title to prevent text wrapping */
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Sprint 1: CD Pipeline Verified!</h1>
        <p>Watchtower is working perfectly.</p>
    </div>
</body>
</html>
