<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Processing Engine</title>
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- --- SECURITY: LOGIN SECTION --- -->
    <div class="login-container">
        <h3>Client Login</h3>
        <div class="input-group">
            <input type="text" id="username" placeholder="Username" class="responsive-input">
            <input type="password" id="password" placeholder="Password" class="responsive-input">
        </div>
        <button onclick="loginUser()" class="responsive-btn">Log In</button>
        <p id="loginStatus" class="status-msg"></p>
    </div>

    <!-- --- APP: DATA INJECTION --- -->
    <div class="app-container">
        <h2>Inject Data</h2>
        <div class="input-group">
            <label>Status (Letters only):</label>
            <input type="text" id="statusInput" class="responsive-input" placeholder="e.g. processed">
        </div>
        <div class="input-group">
            <label>Metric (Positive number):</label>
            <input type="number" id="metricInput" class="responsive-input" placeholder="e.g. 150.5">
        </div>
        <button class="responsive-btn btn-submit" onclick="submitData()">Submit Data</button>
        <div id="message" class="status-msg"></div>

        <hr style="margin: 30px 0; border: 0; border-top: 1px solid #ddd;">

        <!-- --- APP: DASHBOARD --- -->
        <h2>Dashboard & Export</h2>
        <div class="button-group">
            <button class="responsive-btn btn-success" onclick="loadSummary()">Load Live Summary</button>
            <button class="responsive-btn btn-export" onclick="exportCSV()">Download Clean CSV</button>
        </div>

        <div class="dashboard" id="summaryBox">
            <p style="color: #666; font-style: italic;">Click "Load Live Summary" to view calculated data.</p>
        </div>
    </div>

    <!-- Link to external JavaScript -->
    <script src="app.js"></script>
</body>
</html>
