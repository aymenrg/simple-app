name: Sprint 1 CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # --- NEW: PHASE 0 (SECURITY GATING) ---
  security-scan:
    name: CodeQL SAST Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Required for CodeQL to write alerts to your repo
      contents: read
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          # We specify javascript because HTML/JS share the same scanning engine
          languages: 'javascript' 

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # --- EXISTING: PHASE 1, 2, & 3 ---
  build-and-publish:
    needs: security-scan # This is the lock! It waits for the security scan to pass.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- PHASE 1: BUILD & SPIN UP ---
      - name: Build Docker Image Locally
        run: docker build -t local-test-image:latest .

      - name: Spin up Container for Testing
        run: docker run -d -p 8080:80 --name test-container local-test-image:latest

      # --- DIAGNOSTIC & HEALTHCHECK STEP ---
      - name: Wait for server readiness
        run: |
          echo "Checking running containers:"
          docker ps -a
          
          echo "Waiting for http://localhost:8080 to respond..."
          for i in {1..10}; do
            if curl -s http://localhost:8080 > /dev/null; then
              echo "Server is up and accepting traffic!"
              exit 0
            fi
            echo "Server not ready yet, retrying ($i/10)..."
            sleep 2
          done

          echo "ERROR: Server failed to start on port 8080!"
          echo "=== Container Logs ==="
          docker logs test-container
          exit 1

      # --- PHASE 2: PERFORMANCE GATING ---
      - name: Install k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '0.53.0'

      - name: Run k6 Performance & Load Test
        run: k6 run k6-test.js

      # --- PHASE 3: PUBLISH TO VAULT ---
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Verified Image to Vault
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/hello-world-app:latest