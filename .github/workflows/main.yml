name: Sprint 1 CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # --- NEW: PHASE 0 (SECURITY GATING) ---
  security-scan:
    name: CodeQL SAST Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Required for CodeQL to write alerts to your repo
      contents: read
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          # We specify javascript because HTML/JS share the same scanning engine
          languages: 'javascript' 

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # --- EXISTING: PHASE 1, 2, & 3 ---
  build-and-publish:
    needs: security-scan # This is the lock! It waits for the security scan to pass.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- NEW: PHASE 1 (MULTI-CONTAINER BUILD & SPIN UP) ---
      - name: Spin up Architecture
        run: docker compose up -d --build

      # --- DIAGNOSTIC & HEALTHCHECK STEP ---
      - name: Wait for API and Database readiness
        run: |
          echo "Checking running containers:"
          docker ps -a
          
          echo "Waiting for http://localhost:8080/docs to respond..."
          # We give it 15 loops because PostgreSQL takes a few seconds to initialize
          for i in {1..15}; do
            if curl -s http://localhost:8080/docs > /dev/null; then
              echo "API and Database are up and accepting traffic!"
              exit 0
            fi
            echo "Waiting for containers to boot ($i/15)..."
            sleep 2
          done

          echo "ERROR: Server failed to start!"
          echo "=== Multi-Container Logs ==="
          docker compose logs
          exit 1

      # --- PHASE 2: PERFORMANCE GATING ---
      - name: Install k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '0.53.0'

      - name: Run k6 Performance & Load Test
        run: k6 run k6-test.js

      # --- PHASE 3: PUBLISH TO VAULT ---
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Verified Image to Vault
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/hello-world-app:latest